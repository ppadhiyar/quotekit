name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt ruff
      - name: Lint
        run: ruff check apps/api
      - name: Import check
        run: python -c "import sys; sys.path.insert(0, 'apps/api'); import app.main"
        env:
          DEMO_MODE: "true"
      # Full eval run needs Azure credentials — runs on demand, not per-push.
      # Wire AZURE_OPENAI_* and AZURE_SEARCH_* repo secrets, then:
      # - name: Evals
      #   run: python evals/run_evals.py

  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build widget
        working-directory: packages/widget
        run: npm install && npx tsc --noEmit src/widget.ts --lib dom,es2020 && npm run build
